<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conta • Ravena</title><style>body{background:#100d1b;color:#eee;font:16px system-ui;max-width:420px;margin:8vh auto;padding:20px}main{background:#211a30;border:1px solid #73568f;border-radius:18px;padding:24px}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px}button{background:#7649a4;color:white;border:0;cursor:pointer}input{background:#120f1c;color:white;border:1px solid #69577a}a{color:#c9a6ee}</style><main><h1>🌙 Conta de Azarath</h1><p>Entre ou crie sua conta para usar o chat online.</p><form id="f"><label>Usuário (3 a 20 letras, números ou _)<input id="u" required minlength="3" maxlength="20" autocomplete="username"></label><label>Senha (mínimo 10 caracteres)<input id="p" type="password" required minlength="10" autocomplete="current-password"></label><button value="login">Entrar</button><button value="register">Criar conta</button></form><p id="msg" role="status"></p><a href="index.html">Voltar ao jogo</a></main><script src="js/online-config.js"></script><script>const f=document.getElementById('f'),msg=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();const api=window.RAVENA_ONLINE_CONFIG?.apiUrl;if(!api||!/^https:\/\//.test(api)){msg.textContent='Configure apiUrl em js/online-config.js antes de usar contas.';return;}const action=e.submitter?.value==='register'?'register':'login';try{const res=await fetch(api.replace(/\/$/,'')+'/auth/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});const data=await res.json();if(!res.ok)throw Error(data.error||'Falha');sessionStorage.setItem('ravenaSessionV1',data.token);msg.textContent='Conta conectada! Voltando ao jogo…';setTimeout(()=>location.href='index.html',700);}catch(err){msg.textContent=err.message}});</script></html>
